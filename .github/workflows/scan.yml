name: Quét an toàn hằng tuần
on:
  schedule:
    - cron: '17 1 * * 1' # 08:17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-skills.mjs
      - name: Commit kết quả nếu có thay đổi
        run: |
          if git diff --quiet src/data/scan.json; then echo "Không đổi"; exit 0; fi
          git config user.name "skills.vn bot"
          git config user.email "bot@skills.vn"
          git add src/data/scan.json
          git commit -m "Cập nhật kết quả quét an toàn"
          git push
